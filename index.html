<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>اختبار</title>
<style>
body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#f0f4ff;}
.box{background:#fff;padding:30px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.1);width:300px;text-align:center;}
input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box;}
button{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:8px;}
#msg{margin-top:12px;font-size:13px;min-height:20px;}
</style>
</head>
<body>
<div class="box">
  <h3>اختبار تسجيل الدخول</h3>
  <input id="u" placeholder="المستخدم" value="admin"/>
  <input id="p" placeholder="كلمة السر" type="password" value="admin123"/>
  <button onclick="test()">دخول</button>
  <div id="msg"></div>
</div>
<script>
var URL = 'https://dyhhjkotxvjqmgudhzlg.supabase.co/rest/v1/users';
var KEY = 'sb_publishable_1fSMsi24Sc7Cpbt9_7tz2A_j_nYC68R';

async function test() {
  var msg = document.getElementById('msg');
  msg.textContent = '⏳ جاري الاتصال...';
  try {
    var u = document.getElementById('u').value.trim();
    var p = document.getElementById('p').value;
    var r = await fetch(URL + '?username=eq.' + encodeURIComponent(u) + '&password=eq.' + encodeURIComponent(p), {
      headers: {
        'Content-Type': 'application/json',
        'apikey': KEY,
        'Authorization': 'Bearer ' + KEY
      }
    });
    msg.textContent = 'Status: ' + r.status;
    var d = await r.json();
    if (d && d.length) {
      msg.style.color = 'green';
      msg.textContent = '✅ نجح! المستخدم: ' + d[0].username;
    } else {
      msg.style.color = 'red';
      msg.textContent = '❌ بيانات خاطئة أو فارغة — ' + JSON.stringify(d);
    }
  } catch(e) {
    msg.style.color = 'red';
    msg.textContent = '❌ خطأ: ' + e.message;
  }
}
</script>
</body>
</html>
